<meta property="og:title" content="올팩 무료 자료실">
<meta property="og:description" content="릴스에서 본 그 자료, 여기 다 있어요. 복사해서 바로 쓰는 프롬프트와 설치법.">

<style>
:root{
  --bg:#0b0b0d; --bg2:#141417; --card:#18181c; --line:#2a2a30;
  --text:#f2f2f0; --sub:#a6a6ad; --lime:#d7ff3a; --yellow:#ffd43b; --ink:#0b0b0d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:3px;background:var(--lime);display:inline-block}
.logo small{font-weight:500;font-size:12px;color:var(--sub);letter-spacing:0}
.nav-sp{flex:1}
.nav a.tab{font-size:14px;color:var(--sub)}
.nav a.tab.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--lime)}
.btn-cta{background:var(--lime);color:var(--ink);font-weight:900;font-size:14px;padding:9px 16px;border-radius:10px;white-space:nowrap}

/* hero */
.hero{background:var(--lime);color:var(--ink);text-align:center;padding:56px 20px 50px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.08) 1px,transparent 1px);background-size:14px 14px;pointer-events:none}
.label{display:inline-block;background:var(--ink);color:var(--lime);font-weight:900;font-size:12px;letter-spacing:.2em;padding:7px 14px;border-radius:4px;transform:rotate(-2deg);position:relative;z-index:1}
.hero h1{font-size:clamp(30px,6vw,56px);font-weight:900;letter-spacing:-1.5px;line-height:1.2;margin:20px 0 14px;position:relative;z-index:1}
.hero h1 b{background:var(--ink);color:var(--yellow);padding:0 12px;border-radius:6px;display:inline-block;transform:rotate(1deg)}
.hero p{font-size:16px;font-weight:500;position:relative;z-index:1}
.hand{font-family:'Nanum Pen Script',cursive;font-size:24px;margin-top:10px;transform:rotate(-2deg);position:relative;z-index:1}

/* list */
.wrap{max-width:1080px;margin:0 auto;padding:36px 20px 80px}
.search{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;max-width:460px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:15px}
.search svg{flex:none;opacity:.6}
.filters{margin-top:20px;display:grid;gap:10px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow .k{font-size:12px;color:var(--sub);width:34px;flex:none}
.chip{background:var(--bg2);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px}
.chip span{color:var(--sub);font-weight:500;margin-left:4px}
.chip.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.chip.on span{color:var(--ink)}
.count{margin:28px 0 14px;font-size:14px;color:var(--sub)}
.count b{color:var(--text);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s;position:relative}
.card:hover{transform:translateY(-3px);border-color:#44444d}
.card.hot{background:linear-gradient(160deg,#1f2410 0%,var(--card) 55%);border-color:#3c4718}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.tag.t{color:var(--lime);border-color:#3c4718}
.tag.new{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.card h3{font-size:19px;font-weight:900;letter-spacing:-.4px;line-height:1.4;padding-right:46px}
.card p{font-size:14px;padding-right:46px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:#7d7d85;margin-top:auto}
.arrow{position:absolute;right:20px;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-weight:900}
.empty{color:var(--sub);padding:40px 0;text-align:center;grid-column:1/-1}

/* guide page */
.gwrap{max-width:1080px;margin:0 auto;padding:36px 20px 90px;display:grid;grid-template-columns:230px 1fr;gap:44px}
.toc{position:sticky;top:84px;align-self:start}
.toc h4{font-size:13px;color:var(--sub);margin-bottom:12px;font-weight:700}
.toc a{display:flex;gap:10px;font-size:13.5px;color:var(--sub);padding:7px 0;line-height:1.45}
.toc a em{font-style:normal;color:var(--lime);font-weight:900;width:16px;flex:none}
.toc a:hover{color:var(--text)}
.back{display:inline-block;font-size:13px;color:var(--sub);margin-bottom:18px}
.back:hover{color:var(--lime)}
.art{max-width:680px;min-width:0}
.art h1{font-size:clamp(26px,4.4vw,38px);font-weight:900;letter-spacing:-1px;line-height:1.3}
.gmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 26px;font-size:12.5px;color:var(--sub)}
.intro{background:#f4f4ec;color:var(--ink);border-radius:6px;padding:26px 24px 22px;position:relative;font-size:15.5px;margin-bottom:26px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.intro::before{content:"";position:absolute;top:-11px;left:50%;width:92px;height:22px;margin-left:-46px;background:rgba(215,255,58,.85);transform:rotate(-3deg)}
.intro b{font-weight:900}
.intro u{text-decoration:none;background:linear-gradient(transparent 62%,rgba(215,255,58,.9) 62%)}
.art h2{font-size:22px;font-weight:900;letter-spacing:-.5px;margin:40px 0 12px;scroll-margin-top:84px;display:flex;gap:10px;align-items:baseline}
.art h2 em{font-style:normal;color:var(--lime);font-size:14px;font-weight:900;letter-spacing:.05em}
.art p{margin:10px 0;color:#d8d8d6;font-size:15.5px}
.art ul,.art ol{margin:10px 0 10px 20px;color:#d8d8d6;font-size:15.5px}
.art li{margin:6px 0}
.art strong{color:var(--text)}
.art code.i{background:#24242a;padding:1px 6px;border-radius:5px;font-size:.92em}
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
.tbl th{text-align:left;color:var(--sub);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line);padding:8px 10px}
.tbl td{border-bottom:1px solid var(--line);padding:10px;vertical-align:top;color:#d8d8d6}
.tbl td:first-child{color:var(--text);font-weight:700;white-space:nowrap}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;margin:16px 0;overflow:hidden}
.box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.box-h .ttl{display:flex;align-items:center;gap:8px}
.box-h .ttl i{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.copy{flex:none;white-space:nowrap;border:1px solid var(--line);padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--card)}
.copy.ok{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.box pre{padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:#eaeae6}
.box.prompt pre{font-family:'Noto Sans KR',sans-serif;font-size:14.5px}
.box pre mark{background:rgba(255,212,59,.2);color:var(--yellow);padding:0 3px;border-radius:3px}
.note{border-left:3px solid var(--yellow);background:rgba(255,212,59,.06);padding:12px 16px;border-radius:0 10px 10px 0;margin:16px 0;font-size:14.5px;color:#dcdcd6}
.src{margin-top:34px;font-size:12.5px;color:#7d7d85;word-break:break-all}
.src a{text-decoration:underline}
.follow{margin-top:40px;background:var(--lime);color:var(--ink);border-radius:18px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.follow b{font-size:18px;font-weight:900;display:block}
.follow span{font-size:14px}
.follow a{background:var(--ink);color:var(--lime);font-weight:900;padding:11px 18px;border-radius:12px;font-size:14px}
.related{margin-top:44px}
.related h4{font-size:15px;margin-bottom:12px}

footer{border-top:1px solid var(--line);padding:26px 20px;text-align:center;font-size:12.5px;color:#7d7d85}
footer a{color:var(--sub);text-decoration:underline}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .gwrap{grid-template-columns:1fr;gap:0}
  .toc{position:static;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:24px}
  .nav a.tab{display:none}
  .hero{padding:44px 18px 40px}
}
</style>
</head>

    {h:"/init — 프로젝트 규칙 기억시키기", html:`
      <p>클로드 코드는 세션마다 새로 시작해요. <code class="i">/init</code> 을 실행하면 코드베이스를 분석해 빌드·테스트 명령, 프로젝트 규칙을 담은 <b>CLAUDE.md</b>를 만들고, 이후 모든 세션이 시작될 때 자동으로 읽어요. 이미 있으면 덮어쓰지 않고 개선안을 제안해요.</p>

  ],

  ],

/* ---------- helpers ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function code(t){return `<div class="box"><div class="box-h"><span class="ttl"><i></i>명령어</span><button class="copy" data-c="${encodeURIComponent(t)}">복사</button></div><pre>${esc(t)}</pre></div>`}
function plain(html){const d=document.createElement("div");d.innerHTML=html;return d.textContent}

const app=document.getElementById("app");
let state={q:"",tool:"전체",topic:"전체"};
try{const s=JSON.parse(localStorage.getItem("afHub")||"null");if(s)state=Object.assign(state,s)}catch(e){}

function counts(key){
  const m={};GUIDES.forEach(g=>g[key].forEach(v=>m[v]=(m[v]||0)+1));
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function renderList(){
  document.title="올팩 무료 자료실";
  const tools=counts("tools"), topics=counts("topics");
  app.innerHTML=`
  <section class="hero">
    <span class="label">ALLFACTORY FREE GUIDES</span>
    <h1>릴스에서 본 그 자료,<br><b>여기 다 있어요</b></h1>
    <p>복사해서 바로 쓰는 프롬프트와 설치법을 한곳에 모았어요.<br>가입도 결제도 필요 없어요.</p>
    <div class="hand">새 릴스가 나올 때마다 하나씩 늘어나요 ✦</div>
  </section>
  <div class="wrap">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="제목이나 키워드로 찾기 (예: 스킬, 영상)" value="${esc(state.q)}">
    </label>
    <div class="filters">
      <div class="frow"><span class="k">도구</span>${chip("tool","전체",GUIDES.length)}${tools.map(([k,n])=>chip("tool",k,n)).join("")}</div>
      <div class="frow"><span class="k">주제</span>${chip("topic","전체",GUIDES.length)}${topics.map(([k,n])=>chip("topic",k,n)).join("")}</div>
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>`;
  document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;save();renderCards()});
  app.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{state[c.dataset.k]=c.dataset.v;save();renderList()}));
  renderCards();
}
function chip(k,v,n){return `<button class="chip ${state[k]===v?"on":""}" data-k="${k}" data-v="${v}">${v}<span>${n}</span></button>`}
function save(){try{localStorage.setItem("afHub",JSON.stringify(state))}catch(e){}}

function renderCards(){
  const q=state.q.trim().toLowerCase();
  const list=GUIDES.filter(g=>{
    if(state.tool!=="전체"&&!g.tools.includes(state.tool))return false;
    if(state.topic!=="전체"&&!g.topics.includes(state.topic))return false;
    if(!q)return true;
    return (g.title+" "+g.excerpt+" "+g.tools.join(" ")+" "+g.topics.join(" ")+" "+g.keyword).toLowerCase().includes(q);
  });
  document.getElementById("count").innerHTML=`<b>${list.length}</b>편`;
  document.getElementById("grid").innerHTML=list.length?list.map(cardHtml).join(""):`<div class="empty">찾는 자료가 없어요. 인스타 DM으로 요청해 주세요!</div>`;
}
function cardHtml(g){
  return `<a class="card ${g.hot?"hot":""}" href="#${g.id}">
    <div class="tags">${g.isNew?'<span class="tag new">NEW</span>':""}${g.tools.map(t=>`<span class="tag t">${t}</span>`).join("")}${g.topics.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    <h3>${g.title}</h3>
    <p>${g.excerpt}</p>
    <div class="meta">읽는 데 ${g.min}분 · STEP ${g.sections.length}개</div>
    <span class="arrow">→</span>
  </a>`;
}

function renderGuide(g){
  document.title=g.title+" · 올팩";
  const toc=[`<a href="#${g.id}" data-s="quick"><em>✦</em>Quick Start</a>`]
    .concat(g.sections.map((s,i)=>`<a href="#${g.id}" data-s="s${i}"><em>${i+1}</em>${s.h}</a>`)).join("");
  const others=GUIDES.filter(x=>x.id!==g.id&&x.topics.some(t=>g.topics.includes(t))).slice(0,2);
  const more=others.length?others:GUIDES.filter(x=>x.id!==g.id).slice(0,2);
  app.innerHTML=`
  <div class="gwrap">
    <aside class="toc"><h4>이 가이드의 순서</h4>${toc}</aside>
    <article class="art">
      <a class="back" href="#">← 전체 자료 보기</a>
      <h1>${g.title}</h1>
      <div class="gmeta">${g.tools.map(t=>`<span class="tag t">${t}</span>`).join("")}${g.topics.map(t=>`<span class="tag">${t}</span>`).join("")}<span>읽는 데 ${g.min}분 · STEP ${g.sections.length}개 · ${g.date} 작성</span></div>
      <div class="intro">${g.intro}</div>
      <div class="box prompt" id="quick">
        <div class="box-h"><span class="ttl"><i></i>⚡ 복사해서 바로 시작 · ${g.prompt.title}</span><button class="copy" data-c="${encodeURIComponent(plain(g.prompt.text))}">복사</button></div>
        <pre>${g.prompt.text}</pre>
      </div>
      ${g.sections.map((s,i)=>`<h2 id="s${i}"><em>STEP ${String(i+1).padStart(2,"0")}</em>${s.h}</h2>${s.html}`).join("")}
      ${g.sources.length?`<div class="src">출처: ${g.sources.join(" · ")}</div>`:""}
      <div class="follow"><div><b>다음 자료도 받아 가세요</b><span>새 릴스마다 무료 가이드가 하나씩 올라와요</span></div><a href="${IG}" target="_blank" rel="noopener">@ai.allfactory 팔로우</a></div>
      <div class="related"><h4>같이 보면 좋은 자료</h4><div class="grid">${more.map(cardHtml).join("")}</div></div>
    </article>
  </div>`;
  app.querySelectorAll(".toc a").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault();const el=document.getElementById(a.dataset.s);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
  }));
}

/* copy */
document.addEventListener("click",async e=>{
  const b=e.target.closest(".copy");if(!b)return;
  e.preventDefault();e.stopPropagation();
  const t=decodeURIComponent(b.dataset.c);
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(err){
    try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove()}catch(e2){}
  }
  b.textContent=ok?"복사됨 ✓":"길게 눌러 복사";b.classList.toggle("ok",ok);
  setTimeout(()=>{b.textContent="복사";b.classList.remove("ok")},1800);
});

function route(){
  const id=location.hash.replace("#","");
  const g=GUIDES.find(x=>x.id===id);
  if(g)renderGuide(g);else renderList();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
